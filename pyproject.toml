[tool.poetry]
name = "fantasy-football"
version = "0.1.0"
description = "Fantasy football analytics"
authors = ["Calum Thompson"]
readme = "README.md"
packages = [{ include = "fantasy_football", from = "src" }]

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^2.0"
matplotlib = "^3.7"
scikit-learn = "^1.3"
pydantic = "^2.11"
catboost = "^1.2.10"
pulp = "^3.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)"
]
