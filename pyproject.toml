[tool.poetry]
name = "fantasy-football"
version = "0.1.0"
description = "Fantasy football analytics"
authors = ["Calum Thompson"]
readme = "README.md"
packages = [
    { include = "domain", from = "src" },
    { include = "integrations", from = "src" },
    { include = "prediction", from = "src" },
    { include = "training"},
]
[tool.poetry.dependencies]
python = "^3.14"
pandas = "^2.0"
matplotlib = "^3.7"
scikit-learn = "^1.3"
pydantic = "^2.11"
catboost = "^1.2.10"
pulp = "^3.3.2"
joblib = "^1.5"
streamlit = "^1.62.0"
black = "^26.5.1"
ruff = "^0.16.5"
loguru = "^0.7.3"
tqdm = "^4.67.1"
python-dotenv = "^1.2.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)"
]
